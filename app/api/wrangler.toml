name = "variantgpt-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# D1 — metadata + decisions + audit (NOT raw genotypes beyond candidates).
[[d1_databases]]
binding = "DB"
database_name = "variantgpt-db"
database_id = "08b9511b-69c6-49e1-ae83-36a16fe90a28"
migrations_dir = "../../infra/migrations"

# R2 — VCFs, tabix tracks (range-read), reports, generated case.json artifacts.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "variantgpt"

# Native Rate Limiting binding (open beta) — per-user /api/* throttle. 600
# requests / 60s per Clerk user (IP fallback). Per-colo, stateless, no storage
# cost. The rate-limit middleware no-ops when this binding is absent.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 600, period = 60 }

# AI Gateway → OpenRouter / Workers AI (PRD §6.7).
[vars]
AI_GATEWAY_ACCOUNT = ""
AI_GATEWAY_ID = "variantgpt"
OPENROUTER_MODEL_NARRATIVE = "anthropic/claude-3.5-sonnet"
OPENROUTER_MODEL_HPO = "anthropic/claude-3.5-haiku"

# Public base URL of this Worker — the engine POSTs status updates here.
# Updated after the first `wrangler deploy` outputs the workers.dev URL.
PUBLIC_API_BASE = "https://variantgpt-api.shibi-kannan.workers.dev"

# Fly.io-hosted engine endpoint. Updated after `fly deploy` provisions the app.
ENGINE_BASE_URL = "https://variantgpt-engine.fly.dev"

# ── Reference + resources for the aligned-reads (BAM/CRAM) path ──────────────
# These are R2 KEYS within the `variantgpt` bucket — you must upload the actual
# files to these keys (see infra/DEPLOY_BAM_SV.md). REFERENCE_FASTA_KEY is the
# gate: when unset, BAM uploads are rejected. The reference build MUST match
# how the BAMs were aligned (GRCh38 here).
REFERENCE_FASTA_KEY = "refs/GRCh38/Homo_sapiens_assembly38.fasta"
REFERENCE_FAI_KEY   = "refs/GRCh38/Homo_sapiens_assembly38.fasta.fai"
REFERENCE_DICT_KEY  = "refs/GRCh38/Homo_sapiens_assembly38.dict"
# Known-sites VCFs for BQSR (optional — BQSR is skipped if empty). Left empty:
# the R2-download path doesn't fetch the .idx/.tbi indexes GATK needs, so for
# BQSR mount indexed known-sites on a Fly volume via KNOWN_SITES_PATHS instead.
KNOWN_SITES_KEYS    = ""

# ── gCNV panel-of-normals bundle for CNV calling (optional) ──────────────────
# Build once with `variantgpt-engine build-pon`, upload the two outputs to these
# keys. When unset, BAM→SNV still runs; only CNV calling is skipped.
GCNV_MODEL_TGZ_KEY  = "refs/gcnv/gcnv_pon.tgz"
GCNV_INTERVALS_KEY  = "refs/gcnv/filtered.interval_list"

# Secrets (set via `wrangler secret put`):
#   R2_ACCESS_KEY_ID         # for sigv4 presigning of R2 PUT/GET URLs
#   R2_SECRET_ACCESS_KEY
#   R2_ACCOUNT_ID            # your Cloudflare account ID (for the R2 S3 endpoint)
#   ENGINE_BEARER            # shared with Fly engine (Authorization: Bearer ...)
#   ENGINE_WEBHOOK_SECRET    # HMAC secret the engine uses to sign status callbacks
#   OPENROUTER_API_KEY
