name = "variantgpt-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# D1 — metadata + decisions + audit (NOT raw genotypes beyond candidates).
[[d1_databases]]
binding = "DB"
database_name = "variantgpt"
database_id = "REPLACE_WITH_D1_ID"
migrations_dir = "../../infra/migrations"

# R2 — VCFs, tabix tracks (range-read), reports, generated case.json artifacts.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "variantgpt"

# Engine — Python engine runs as a Cloudflare Container. Worker invokes it
# per-case via the EngineContainer Durable Object binding. The container HTTP
# server lives at engine/container_server.py (port 8080).
[[durable_objects.bindings]]
name = "ENGINE"
class_name = "EngineContainer"

[[containers]]
class_name = "EngineContainer"
image = "../../engine/Dockerfile"
name = "variantgpt-engine"
max_instances = 10

[[migrations]]
tag = "v1"
new_sqlite_classes = ["EngineContainer"]

# AI Gateway → OpenRouter / Workers AI (PRD §6.7).
[vars]
AI_GATEWAY_ACCOUNT = ""
AI_GATEWAY_ID = "variantgpt"
OPENROUTER_MODEL_NARRATIVE = "anthropic/claude-3.5-sonnet"
OPENROUTER_MODEL_HPO = "anthropic/claude-3.5-haiku"
# Public base URL of this Worker — the container POSTs status updates here.
# Set per-environment; default suits the default workers.dev hostname.
PUBLIC_API_BASE = "https://variantgpt-api.workers.dev"

# Secrets (set via `wrangler secret put`):
#   R2_ACCESS_KEY_ID         # for sigv4 presigning of R2 PUT/GET URLs
#   R2_SECRET_ACCESS_KEY
#   R2_ACCOUNT_ID            # your Cloudflare account ID (for the R2 S3 endpoint)
#   ENGINE_WEBHOOK_SECRET    # HMAC secret the container uses to sign callbacks
#   OPENROUTER_API_KEY
