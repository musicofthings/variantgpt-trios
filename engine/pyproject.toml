[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "variantgpt-engine"
version = "0.1.0"
description = "VariantGPT off-edge genomics engine: VCF intake, joint merge, inheritance modeling, ACMG point classification, and South Asian VUS reclassification."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "VariantGPT" }]
license = { text = "Proprietary" }
dependencies = [
    "cyvcf2>=0.30.28",
    "pysam>=0.22",
    "pandas>=2.2",
    "polars>=0.20",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "networkx>=3.2",
    "requests>=2.32",
    "httpx>=0.27",
    "CrossMap>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.15.22",
    "mypy>=1.10",
]

[project.scripts]
variantgpt-engine = "variantgpt_engine.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Explicit rule selection — CI has, without warning, gone from "ruff check
# passes" to "308 findings" purely from an unpinned ruff release bumping its
# own default rule set (ruff==0.16.0 enables ~400 rules by default vs.
# 0.15.22's E4/E7/E9/F, with no source change at all). Pinning ruff (above)
# fixes today's break; this pins the *intent* so the next ruff release can't
# silently do the same thing again — CI now depends on an explicit list, not
# on whatever a given ruff version happens to default to.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
