[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "variantgpt-engine"
version = "0.1.0"
description = "VariantGPT off-edge genomics engine: VCF intake, joint merge, inheritance modeling, ACMG point classification, and South Asian VUS reclassification."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "VariantGPT" }]
license = { text = "Proprietary" }
dependencies = [
    "cyvcf2>=0.30.28",
    "pysam>=0.22",
    "pandas>=2.2",
    "polars>=0.20",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "networkx>=3.2",
    "requests>=2.32",
    "httpx>=0.27",
    "CrossMap>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
variantgpt-engine = "variantgpt_engine.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
