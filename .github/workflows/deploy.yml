name: deploy

# Deploys on every push to main. A first "changes" job inspects the diff
# and emits booleans; downstream jobs use `if:` to skip when their slice
# is untouched. The whole workflow is still a single graph so SPA-only
# commits don't spin up the engine deploy on Fly (which is the expensive
# one) and engine-only commits don't redeploy the SPA / Worker.
#
# Path-filter rules:
#   engine_changed = engine/** OR tracks/** OR fly.toml OR this workflow
#   api_changed    = app/api/** OR infra/** OR this workflow
#   web_changed    = app/web/** OR this workflow
#
# The workflow file itself is in every set so editing CI always re-runs
# the affected job(s) for a sanity check.
#
# Secrets the repo needs (GitHub → Settings → Secrets and variables → Actions):
#   FLY_API_TOKEN             — from https://fly.io/user/personal_access_tokens
#   ENGINE_BEARER             — long-random string; same value the Worker uses
#   CLOUDFLARE_API_TOKEN      — Cloudflare API token w/ Workers + R2 + D1 + Pages
#   CLOUDFLARE_ACCOUNT_ID     — 3b54d713791d243cfbed61dfeb46e1fc

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            engine:
              - 'engine/**'
              - 'tracks/**'
              - 'fly.toml'
              - '.github/workflows/deploy.yml'
            api:
              - 'app/api/**'
              - 'infra/**'
              - '.github/workflows/deploy.yml'
            web:
              - 'app/web/**'
              - '.github/workflows/deploy.yml'

  engine:
    name: Deploy engine (Fly.io)
    runs-on: ubuntu-latest
    needs: changes
    # Workflow_dispatch always runs (manual re-deploy). Push only runs when
    # engine paths changed.
    if: ${{ needs.changes.outputs.engine == 'true' || github.event_name == 'workflow_dispatch' }}
    concurrency: { group: fly-engine, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Create the Fly app on first run (idempotent: re-running is a no-op).
      # `flyctl apps create` exits non-zero if the app already exists, so we
      # tolerate that specifically.
      - name: Create app if missing
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if flyctl apps list --json | grep -qi '"name": *"variantgpt-engine"'; then
            echo "App variantgpt-engine already exists"
          else
            flyctl apps create variantgpt-engine || \
              flyctl apps list --json | grep -qi '"name": *"variantgpt-engine"' || \
              { echo "create failed and app still missing"; exit 1; }
          fi

      # Push ENGINE_BEARER as a Fly secret on every run so a rotation in GitHub
      # propagates automatically. --stage avoids triggering an extra restart.
      - name: Set bearer secret
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl secrets set --app variantgpt-engine \
            ENGINE_BEARER='${{ secrets.ENGINE_BEARER }}' \
            --stage

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --app variantgpt-engine

  api:
    name: Deploy Worker (Cloudflare)
    runs-on: ubuntu-latest
    needs: [changes, engine]
    # The engine job may be skipped (no engine changes) — `needs:` still
    # requires us to allow that. `always()` + explicit success/skip check
    # covers both "engine ran and passed" and "engine was skipped".
    if: |
      always() &&
      (needs.engine.result == 'success' || needs.engine.result == 'skipped') &&
      (needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch')
    defaults: { run: { working-directory: app/api } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "20" }
      - run: npm ci || npm install
      - run: npm run typecheck
      - name: wrangler deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app/api

  web:
    name: Deploy SPA (Cloudflare Pages)
    runs-on: ubuntu-latest
    needs: [changes, api]
    if: |
      always() &&
      (needs.api.result == 'success' || needs.api.result == 'skipped') &&
      (needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch')
    defaults: { run: { working-directory: app/web } }
    env:
      VITE_API_BASE: https://variantgpt-api.shibi-kannan.workers.dev
      # Clerk publishable key — bundled into the SPA at build time by Vite.
      # Cloudflare Pages dashboard env vars do NOT reach this build (those
      # only apply to Pages-managed builds; we use `wrangler pages deploy`
      # to upload pre-built artifacts). Set this as a GitHub Actions
      # *variable* (Settings → Secrets and variables → Actions → Variables):
      #   Name:  VITE_CLERK_PUBLISHABLE_KEY
      #   Value: pk_test_...   or   pk_live_...
      # The key is public by design (gets embedded in client JS), so it
      # belongs in `vars.` not `secrets.`. When unset, the SPA falls back
      # to dev-mode pass-through (no auth required client-side).
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "20" }
      - run: npm ci || npm install
      - run: npm run build
      - name: wrangler pages deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app/web
          command: pages deploy dist --project-name=variantgpt-web --branch=main
