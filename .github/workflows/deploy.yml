name: deploy

# Deploys on every push to main, but each job only runs when its own files
# change. This avoids the trap where an SPA-only commit redeploys the Fly
# engine and kills any in-flight job.
#
# Path-filter rules (dorny/paths-filter@v3):
#   engine job → engine/, tracks/, fly.toml, engine/Dockerfile
#   api job    → app/api/, infra/migrations/
#   web job    → app/web/
# A workflow_dispatch run forces all three jobs regardless of paths.
#
# Secrets the repo needs (GitHub → Settings → Secrets and variables → Actions):
#   FLY_API_TOKEN             — from https://fly.io/user/personal_access_tokens
#   ENGINE_BEARER             — long-random string; same value the Worker uses
#   CLOUDFLARE_API_TOKEN      — Cloudflare API token w/ Workers + R2 + D1 + Pages
#   CLOUDFLARE_ACCOUNT_ID     — 3b54d713791d243cfbed61dfeb46e1fc

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    name: Detect which services changed
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            engine:
              - 'engine/**'
              - 'tracks/**'
              - 'fly.toml'
            api:
              - 'app/api/**'
              - 'infra/migrations/**'
            web:
              - 'app/web/**'

  engine:
    name: Deploy engine (Fly.io)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.engine == 'true' || github.event_name == 'workflow_dispatch'
    concurrency: { group: fly-engine, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Create the Fly app on first run (idempotent: re-running is a no-op).
      # `flyctl apps create` exits non-zero if the app already exists, so we
      # tolerate that specifically.
      - name: Create app if missing
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if flyctl apps list --json | grep -qi '"name": *"variantgpt-engine"'; then
            echo "App variantgpt-engine already exists"
          else
            flyctl apps create variantgpt-engine || \
              flyctl apps list --json | grep -qi '"name": *"variantgpt-engine"' || \
              { echo "create failed and app still missing"; exit 1; }
          fi

      # Push ENGINE_BEARER as a Fly secret on every run so a rotation in GitHub
      # propagates automatically. --stage avoids triggering an extra restart.
      - name: Set bearer secret
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl secrets set --app variantgpt-engine \
            ENGINE_BEARER='${{ secrets.ENGINE_BEARER }}' \
            --stage

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --app variantgpt-engine

  api:
    name: Deploy Worker (Cloudflare)
    runs-on: ubuntu-latest
    needs: [changes, engine]
    # always() lets us run even if engine was skipped (no relevant changes).
    if: ${{ always() && (needs.changes.outputs.api == 'true' || needs.engine.result == 'success' || github.event_name == 'workflow_dispatch') }}
    defaults: { run: { working-directory: app/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci || npm install
      - run: npm run typecheck
      - name: wrangler deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app/api

  web:
    name: Deploy SPA (Cloudflare Pages)
    runs-on: ubuntu-latest
    needs: [changes, api]
    if: ${{ always() && (needs.changes.outputs.web == 'true' || needs.api.result == 'success' || github.event_name == 'workflow_dispatch') }}
    defaults: { run: { working-directory: app/web } }
    env:
      VITE_API_BASE: https://variantgpt-api.shibi-kannan.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci || npm install
      - run: npm run build
      - name: wrangler pages deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app/web
          command: pages deploy dist --project-name=variantgpt-web --branch=main
