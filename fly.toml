# Fly.io config for the VariantGPT engine.
#
# Build context is the repo root (so the Dockerfile can COPY both engine/ and
# tracks/). Deploy with:
#
#   fly deploy --remote-only
#
# Fly's remote builder handles the Docker image build — no local Docker daemon
# required. First deploy: `fly launch --no-deploy --copy-config` to provision
# the app, then `fly secrets set ENGINE_BEARER=...` before the first `fly deploy`.

app = "variantgpt-engine"
primary_region = "iad"          # change to closer region (e.g. "bom" for Mumbai)

[build]
  dockerfile = "engine/Dockerfile"

# Persistent storage for the AnnotSV annotation databases (the image is built
# with INSTALL_ANNOTSV_DB=false to stay lean). The volume is mounted over
# AnnotSV's share/ dir; populate it ONCE with tracks/populate_annotsv_db.sh
# (see infra/DEPLOY_BAM_SV.md). Until populated, the per-case CNV/AnnotSV step
# degrades gracefully (SNV calling is unaffected). Create the volume first:
#   fly volumes create annotsv_data --size 10 --region <region>
[[mounts]]
  source = "annotsv_data"
  destination = "/opt/AnnotSV/share"

[env]
  PORT = "8080"
  VGPT_DEBUG = "0"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine warm at all times. With auto_stop=stop + min=0 the proxy
  # would kill the machine ~60-300s after the inbound /run request appeared
  # idle to it (which happens at ~30s when the Worker's executionCtx.waitUntil
  # expires and the Worker→Fly TCP connection drops). The engine job would
  # die mid-pipeline. min_machines_running=1 fixes that. Free-tier covers up
  # to 3 shared-cpu-1x machines so this stays within the free allotment.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 5
    soft_limit = 3

[[vm]]
  # shared-cpu-4x with 8 GB. Sized for clinical-grade trio workloads:
  #   - 4 vCPUs let asyncio.gather + httpx schedule more concurrent
  #     network requests without core contention (the AF lookup,
  #     VEP REST, ClinVar overlay, and IndiGen passes all benefit).
  #   - 8 GB removes the headroom worry entirely. We've optimized peak
  #     to ~2-3 GB via chunking + gc; this gives 2-3× safety margin
  #     so a single large case (e.g. WGS with low pre-filter) can't
  #     OOM.
  #   - Cost ~$57/mo always-on (min_machines_running=1). Worth the
  #     bump vs $26/mo on shared-cpu-2x because annotate+classify
  #     drops ~30-40% wall-clock with twice the CPU available.
  # Cap is shared-cpu-8x / 16 GB if we ever need more; beyond that
  # the workload is network-bound and a bigger VM won't help.
  cpu_kind = "shared"
  cpus = 4
  memory_mb = 8192

# Auth: the Worker passes a shared bearer in Authorization: Bearer <token>.
# Set as a Fly secret (not in [env]):
#   fly secrets set ENGINE_BEARER=<long-random-string>
