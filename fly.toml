# Fly.io config for the VariantGPT engine.
#
# Build context is the repo root (so the Dockerfile can COPY both engine/ and
# tracks/). Deploy with:
#
#   fly deploy --remote-only
#
# Fly's remote builder handles the Docker image build — no local Docker daemon
# required. First deploy: `fly launch --no-deploy --copy-config` to provision
# the app, then `fly secrets set ENGINE_BEARER=...` before the first `fly deploy`.

app = "variantgpt-engine"
primary_region = "iad"          # change to closer region (e.g. "bom" for Mumbai)

[build]
  dockerfile = "engine/Dockerfile"

[env]
  PORT = "8080"
  VGPT_DEBUG = "0"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine warm at all times. With auto_stop=stop + min=0 the proxy
  # would kill the machine ~60-300s after the inbound /run request appeared
  # idle to it (which happens at ~30s when the Worker's executionCtx.waitUntil
  # expires and the Worker→Fly TCP connection drops). The engine job would
  # die mid-pipeline. min_machines_running=1 fixes that. Free-tier covers up
  # to 3 shared-cpu-1x machines so this stays within the free allotment.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 5
    soft_limit = 3

[[vm]]
  # shared-cpu-2x with 4 GB. 2 GB on shared-cpu-1x was still OOM-killing
  # silently after VEP REST completed (the gather of all 43 batch results
  # + the variants list + pydantic overhead briefly peaks above 2 GB).
  # shared-cpu-2x caps at 4 GB; that's our ceiling here. For inputs beyond
  # ~15k surviving variants we'd need to upgrade to shared-cpu-4x (8 GB)
  # or move to a different host. Cost ~$8/mo.
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 4096

# Auth: the Worker passes a shared bearer in Authorization: Bearer <token>.
# Set as a Fly secret (not in [env]):
#   fly secrets set ENGINE_BEARER=<long-random-string>
