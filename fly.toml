# Fly.io config for the VariantGPT engine.
#
# Build context is the repo root (so the Dockerfile can COPY both engine/ and
# tracks/). Deploy with:
#
#   fly deploy --remote-only
#
# Fly's remote builder handles the Docker image build — no local Docker daemon
# required. First deploy: `fly launch --no-deploy --copy-config` to provision
# the app, then `fly secrets set ENGINE_BEARER=...` before the first `fly deploy`.

app = "variantgpt-engine"
primary_region = "iad"          # change to closer region (e.g. "bom" for Mumbai)

[build]
  dockerfile = "engine/Dockerfile"

# Persistent storage for the AnnotSV annotation databases (the image is built
# with INSTALL_ANNOTSV_DB=false to stay lean). The volume is mounted over
# AnnotSV's share/ dir; populate it ONCE with tracks/populate_annotsv_db.sh
# (see infra/DEPLOY_BAM_SV.md). Until populated, the per-case CNV/AnnotSV step
# degrades gracefully (SNV calling is unaffected). Create the volume first:
#   fly volumes create annotsv_data --size 10 --region <region>
# Fly machines support only ONE volume, so the AnnotSV annotation DB and the
# reference genome (+ BWA index) share this volume. AnnotSV lives at the mount
# root; the reference goes in a refs/ subdir. Built once by
# tracks/build_reference_volume.sh (GRCh38 FASTA/.fai/.dict + `bwa index`).
# REFERENCE_FASTA_PATH points the engine at it so it doesn't re-download a
# multi-GB reference per case (and FASTQ alignment needs the on-disk BWA index).
[[mounts]]
  source = "annotsv_data"
  destination = "/opt/AnnotSV/share"

[env]
  PORT = "8080"
  VGPT_DEBUG = "0"
  REFERENCE_FASTA_PATH = "/opt/AnnotSV/share/refs/Homo_sapiens_assembly38.fasta"

[http_service]
  internal_port = 8080
  force_https = true
  # Scale-to-zero (pay only for run-seconds). auto_start cold-starts a machine on
  # an inbound /run; auto_stop is OFF so Fly never idle-stops mid-job (the Worker
  # connection drops ~30s in while a case runs for minutes — Fly's idle-stop would
  # otherwise kill it). Instead the engine stops ITSELF once idle, via the Fly
  # Machines API (see _self_stop_if_idle in tracks/container_server.py). Requires:
  #   fly tokens create deploy -a variantgpt-engine
  #   fly secrets set FLY_API_TOKEN=<that token>
  # Without the token the engine never self-stops (safe fallback: stays running).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 5
    soft_limit = 3

[[vm]]
  # shared-cpu-2x with 4 GB. The workload is network-bound (AF lookup, VEP REST,
  # ClinVar overlay, IndiGen — all asyncio + httpx), so extra vCPUs mostly idle
  # waiting on I/O, and measured peak memory is ~2-3 GB (chunking + gc). 4 GB
  # keeps ~1.3-2× headroom over peak; 2 vCPUs still overlap network waits fine.
  #
  # Cost: with scale-to-zero (see [http_service]) this only bills while a case
  # runs — a few cents per trio, ~$0 idle (vs ~$57/mo always-on at the previous
  # shared-cpu-4x/8 GB). The smaller size also makes each run cheaper. If you
  # ever see an OOM on an unusually large WGS case, bump memory_mb to 6144 before
  # adding vCPUs (the bottleneck is RAM/network, not CPU).
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 4096

# Auth: the Worker passes a shared bearer in Authorization: Bearer <token>.
# Set as a Fly secret (not in [env]):
#   fly secrets set ENGINE_BEARER=<long-random-string>
